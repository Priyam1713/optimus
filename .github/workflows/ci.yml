name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Both, deliberately: this project is developed on Windows and the two
        # bugs it has shipped over line endings and text-mode file handles were
        # both platform-specific (STATUS.md findings M1-1 and M2-1).
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[loop,dev]"

      - name: Test
        run: python -m pytest -q

      - name: The demo, end to end
        # Tests are necessary and not sufficient - CONTRIBUTING.md rule 3.
        # 115 tests once passed while the harness lowercased every filename it
        # created, and running this is what caught it.
        if: runner.os == 'Linux'
        run: python scripts/m3_demo.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install ruff
      - run: ruff check src tests scripts
